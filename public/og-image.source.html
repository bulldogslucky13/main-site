<!doctype html>
<!--
	Source artboard for og-image.jpg (the home page link-preview card).
	Edit this, then re-render at exactly 1200x630 and save over og-image.jpg:

	  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
	    --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
	    --virtual-time-budget=5000 --screenshot=og.png "file://$PWD/public/og-image.source.html"
	  sips -s format jpeg -s formatOptions 90 og.png --out public/og-image.jpg
-->
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				background: #f4ecdf;
			}
			.card {
				position: relative;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #f4ecdf;
				color: #16120f;
				display: flex;
				align-items: center;
				gap: 64px;
				padding: 0 80px;
			}
			.copy {
				flex: 1;
			}
			.eyebrow {
				font-family: 'IBM Plex Mono', ui-monospace, monospace;
				font-size: 22px;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: #4a3f35;
			}
			h1 {
				margin-top: 28px;
				font-family: 'Cormorant Garamond', Georgia, serif;
				font-weight: 600;
				font-size: 84px;
				line-height: 0.98;
				letter-spacing: -0.01em;
			}
			/* Mirrors the hero's Mark: a tight band behind the glyphs, not a full line-height box. */
			mark {
				position: relative;
				z-index: 0;
				background: transparent;
				color: inherit;
			}
			mark::before {
				content: '';
				position: absolute;
				left: -0.1em;
				right: -0.1em;
				top: 0.14em;
				bottom: 0.02em;
				z-index: -1;
				border-radius: 0.12em;
				background: #e2d3bd;
			}
			.byline {
				margin-top: 40px;
				font-family: 'IBM Plex Mono', ui-monospace, monospace;
				font-size: 22px;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				display: flex;
				gap: 18px;
				align-items: center;
			}
			.byline .dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: #8a7a68;
			}
			.byline .domain {
				color: #4a3f35;
				text-transform: none;
				letter-spacing: 0.04em;
			}
			.photo {
				flex-shrink: 0;
				width: 380px;
				height: 380px;
				border-radius: 50%;
				overflow: hidden;
				box-shadow: 0 0 0 1px #8a7a68, 0 0 0 14px #f4ecdf, 0 0 0 15px #c9b79c;
			}
			.photo img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: 50% 30%;
				transform: scale(1.15);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="copy">
				<p class="eyebrow">Product &amp; software engineer</p>
				<h1>I build software people can feel the <mark>care</mark> in.</h1>
				<div class="byline">
					<span>Cameron Bristol</span>
					<span class="dot"></span>
					<span class="domain">cameronbristol.xyz</span>
				</div>
			</div>
			<div class="photo"><img src="headshot.jpeg" alt="" /></div>
		</div>
	</body>
</html>
